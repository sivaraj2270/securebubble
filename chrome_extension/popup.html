<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      background: #18102B;
      color: #FFFFFF;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 16px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .icon {
      width: 32px;
      height: 32px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid #8B5CF6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .title {
      font-size: 15px;
      font-weight: 900;
    }
    .status {
      font-size: 12px;
      color: #9CA3AF;
      margin-bottom: 16px;
    }
    .toggle-btn {
      width: 100%;
      padding: 14px;
      background: #8B5CF6;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-weight: 900;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }
    .toggle-btn.off {
      background: #EF4444;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">🛡</div>
    <div class="title">SecureBubble AI 360</div>
  </div>
  <div class="status" id="statusText">Floating bubble is currently ON</div>

  <button id="toggleBtn" class="toggle-btn">TURN OFF FLOATING BUBBLE</button>

  <script src="popup.js"></script>
</body>
</html>
